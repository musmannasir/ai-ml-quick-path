<svg viewBox="0 0 720 352" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- The context window shared by prompt, documents, conversation and answer. -->
  <text class="vz-title" x="20" y="30" text-anchor="start">The context window is a desk of limited size</text>
  <text class="vz-s" x="20" y="52" text-anchor="start">Everything the model reads and writes in one request has to fit on it:</text>
  <rect class="vz-ml" x="40" y="66" width="128.0" height="62" rx="4"/>
  <text class="vz-s" x="104.0" y="94" text-anchor="middle">Your prompt</text>
  <text class="vz-s" x="104.0" y="114" text-anchor="middle">20%</text>
  <rect class="vz-ap" x="168.0" y="66" width="256.0" height="62" rx="4"/>
  <text class="vz-s" x="296.0" y="94" text-anchor="middle">Documents</text>
  <text class="vz-s" x="296.0" y="114" text-anchor="middle">40%</text>
  <rect class="vz-lm" x="424.0" y="66" width="160.0" height="62" rx="4"/>
  <text class="vz-s" x="504.0" y="94" text-anchor="middle">Conversation</text>
  <text class="vz-s" x="504.0" y="114" text-anchor="middle">25%</text>
  <rect class="vz-ok" x="584.0" y="66" width="96.0" height="62" rx="4"/>
  <text class="vz-s" x="632.0" y="94" text-anchor="middle">Answer</text>
  <text class="vz-s" x="632.0" y="114" text-anchor="middle">15%</text>
  <line class="vz-limit" x1="680" y1="58" x2="680" y2="136"/>
  <text class="vz-s" x="680" y="154" text-anchor="end">limit (in tokens)</text>
  <text class="vz-title" x="20" y="200" text-anchor="start">When the text is too long, something has to go:</text>
  <rect class="vz-ml" x="40" y="214" width="96.0" height="50" rx="4"/>
  <text class="vz-s" x="88.0" y="244" text-anchor="middle">Prompt</text>
  <rect class="vz-ap" x="136.0" y="214" width="256.0" height="50" rx="4"/>
  <text class="vz-s" x="264.0" y="244" text-anchor="middle">Documents</text>
  <rect class="vz-lm" x="392.0" y="214" width="160.0" height="50" rx="4"/>
  <text class="vz-s" x="472.0" y="244" text-anchor="middle">Conversation</text>
  <rect class="vz-ok" x="552.0" y="214" width="76.8" height="50" rx="4"/>
  <text class="vz-s" x="590.4" y="244" text-anchor="middle">Answer</text>
  <line class="vz-limit" x1="680" y1="206" x2="680" y2="272"/>
  <rect class="vz-cut" x="40" y="274" width="120" height="32" rx="6"/>
  <text class="vz-s" x="100" y="295" text-anchor="middle">cut text</text>
  <text class="vz-s" x="176" y="295" text-anchor="start">← oldest or least useful text is cut; the model never sees it</text>
  <text class="vz-n vz-note" x="20" y="336" text-anchor="start">The percentages are illustrative: the real split changes with every request.</text>
</svg>
