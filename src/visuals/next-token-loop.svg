<svg viewBox="0 0 720 338" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- A model picks the next token, adds it, and repeats. -->
  <text class="vz-title" x="20" y="30" text-anchor="start">Text so far</text>
  <rect class="vz-card" x="20" y="42" width="470" height="52" rx="10"/>
  <text class="vz-title" x="36" y="75" text-anchor="start">The capital of France is</text>
  <rect class="vz-slot" x="330" y="52" width="100" height="32" rx="6"/>
  <text class="vz-title" x="380" y="74" text-anchor="middle">?</text>
  <rect class="vz-lm" x="120" y="150" width="180" height="70" rx="12"/>
  <text class="vz-title" x="210" y="178" text-anchor="middle">Model</text>
  <text class="vz-s" x="210" y="198" text-anchor="middle">reads all the text so far</text>
  <line class="vz-arrow" x1="210.0" y1="98.0" x2="210.0" y2="135.0"/>
  <polygon class="vz-headk" points="210.0,146.0 216.0,135.0 204.0,135.0"/>
  <line class="vz-arrow" x1="304.0" y1="185.0" x2="381.3" y2="166.6"/>
  <polygon class="vz-headk" points="392.0,164.0 379.9,160.7 382.7,172.4"/>
  <rect class="vz-card" x="396" y="118" width="300" height="150" rx="10"/>
  <text class="vz-title" x="410" y="142" text-anchor="start">Chances for the next token</text>
  <text class="vz-s" x="410" y="169" text-anchor="start">Paris</text>
  <rect class="vz-barhi" x="470" y="156" width="171.0" height="14" rx="3"/>
  <text class="vz-s" x="645.0" y="168" text-anchor="start">0.90</text>
  <text class="vz-s" x="410" y="190" text-anchor="start">the</text>
  <rect class="vz-barv" x="470" y="177" width="7.6000000000000005" height="14" rx="3"/>
  <text class="vz-s" x="481.6" y="189" text-anchor="start">0.04</text>
  <text class="vz-s" x="410" y="211" text-anchor="start">a</text>
  <rect class="vz-barv" x="470" y="198" width="5.7" height="14" rx="3"/>
  <text class="vz-s" x="479.7" y="210" text-anchor="start">0.03</text>
  <text class="vz-s" x="410" y="232" text-anchor="start">known</text>
  <rect class="vz-barv" x="470" y="219" width="3.8000000000000003" height="14" rx="3"/>
  <text class="vz-s" x="477.8" y="231" text-anchor="start">0.02</text>
  <text class="vz-s" x="410" y="253" text-anchor="start">…</text>
  <rect class="vz-barv" x="470" y="240" width="2" height="14" rx="3"/>
  <text class="vz-s" x="475.9" y="252" text-anchor="start">0.01</text>
  <line class="vz-arrow" x1="640.0" y1="118.0" x2="442.9" y2="89.6"/>
  <polygon class="vz-headk" points="432.0,88.0 442.0,95.5 443.7,83.6"/>
  <text class="vz-s" x="560" y="96" text-anchor="middle">pick one</text>
  <text class="vz-s" x="20" y="252" text-anchor="start">1. The model scores every possible next token.</text>
  <text class="vz-s" x="20" y="272" text-anchor="start">2. One is chosen (the highest, or at random by chance).</text>
  <text class="vz-s" x="20" y="292" text-anchor="start">3. It is added to the text, and the loop repeats.</text>
  <text class="vz-n vz-note" x="20" y="322" text-anchor="start">Made-up chances. A real model scores its whole vocabulary of tens of thousands of tokens.</text>
</svg>
