<svg viewBox="0 0 720 322" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Residuals: the gaps between the points and the fitted line. -->
  <rect class="vz-card" x="12" y="12" width="460" height="270" rx="10"/>
  <line class="vz-axis" x1="30" y1="252" x2="450" y2="252"/>
  <line class="vz-axis" x1="30" y1="252" x2="30" y2="40"/>
  <line class="vz-fit" x1="50" y1="174.8" x2="450" y2="38.0"/>
  <line class="vz-resid2" x1="70" y1="181.6" x2="70" y2="167.9"/>
  <circle class="vz-pt" cx="70.0" cy="181.6" r="5.5"/>
  <line class="vz-resid2" x1="110" y1="156.4" x2="110" y2="154.2"/>
  <circle class="vz-pt" cx="110.0" cy="156.4" r="5.5"/>
  <line class="vz-resid2" x1="150" y1="170.8" x2="150" y2="140.6"/>
  <circle class="vz-pt" cx="150.0" cy="170.8" r="5.5"/>
  <line class="vz-resid2" x1="190" y1="120.4" x2="190" y2="126.9"/>
  <circle class="vz-pt" cx="190.0" cy="120.4" r="5.5"/>
  <line class="vz-resid2" x1="230" y1="142.0" x2="230" y2="113.2"/>
  <circle class="vz-pt" cx="230.0" cy="142.0" r="5.5"/>
  <line class="vz-resid2" x1="270" y1="91.6" x2="270" y2="99.5"/>
  <circle class="vz-pt" cx="270.0" cy="91.6" r="5.5"/>
  <line class="vz-resid2" x1="310" y1="109.6" x2="310" y2="85.8"/>
  <circle class="vz-pt" cx="310.0" cy="109.6" r="5.5"/>
  <line class="vz-resid2" x1="350" y1="66.4" x2="350" y2="72.2"/>
  <circle class="vz-pt" cx="350.0" cy="66.4" r="5.5"/>
  <line class="vz-resid2" x1="390" y1="91.6" x2="390" y2="58.5"/>
  <circle class="vz-pt" cx="390.0" cy="91.6" r="5.5"/>
  <line class="vz-resid2" x1="430" y1="55.6" x2="430" y2="44.8"/>
  <circle class="vz-pt" cx="430.0" cy="55.6" r="5.5"/>
  <text class="vz-title" x="500" y="50" text-anchor="start">Regression error</text>
  <text class="vz-s" x="500" y="80" text-anchor="start">Dots = real values.</text>
  <text class="vz-s" x="500" y="98" text-anchor="start">Line = the model's guesses.</text>
  <text class="vz-s" x="500" y="126" text-anchor="start">Orange gaps = the errors</text>
  <text class="vz-s" x="500" y="144" text-anchor="start">(residuals).</text>
  <text class="vz-s" x="500" y="178" text-anchor="start">MAE: the average gap.</text>
  <text class="vz-s" x="500" y="198" text-anchor="start">RMSE: punishes big gaps</text>
  <text class="vz-s" x="500" y="216" text-anchor="start">more.</text>
  <text class="vz-s" x="500" y="244" text-anchor="start">R²: how much of the</text>
  <text class="vz-s" x="500" y="262" text-anchor="start">ups and downs it explains.</text>
  <text class="vz-n vz-note" x="12" y="306" text-anchor="start">Made-up points. Smaller MAE and RMSE are better; R² is better the closer it is to 1.</text>
</svg>
