<svg viewBox="0 0 720 306" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- A user-by-item ratings table with empty cells to predict. -->
  <text class="vz-title" x="20" y="30" text-anchor="start">Ratings table: mostly empty</text>
  <text class="vz-s" x="180" y="64" text-anchor="middle">Item A</text>
  <text class="vz-s" x="260" y="64" text-anchor="middle">Item B</text>
  <text class="vz-s" x="340" y="64" text-anchor="middle">Item C</text>
  <text class="vz-s" x="420" y="64" text-anchor="middle">Item D</text>
  <text class="vz-s" x="20" y="104" text-anchor="start">User 1</text>
  <rect class="vz-ml" x="150" y="76" width="60" height="38" rx="6"/>
  <text class="vz-title" x="180" y="102" text-anchor="middle">5</text>
  <rect class="vz-warn vz-dash" x="230" y="76" width="60" height="38" rx="6"/>
  <text class="vz-title" x="260" y="102" text-anchor="middle">?</text>
  <rect class="vz-ml" x="310" y="76" width="60" height="38" rx="6"/>
  <text class="vz-title" x="340" y="102" text-anchor="middle">3</text>
  <rect class="vz-warn vz-dash" x="390" y="76" width="60" height="38" rx="6"/>
  <text class="vz-title" x="420" y="102" text-anchor="middle">?</text>
  <text class="vz-s" x="20" y="150" text-anchor="start">User 2</text>
  <rect class="vz-warn vz-dash" x="150" y="122" width="60" height="38" rx="6"/>
  <text class="vz-title" x="180" y="148" text-anchor="middle">?</text>
  <rect class="vz-ml" x="230" y="122" width="60" height="38" rx="6"/>
  <text class="vz-title" x="260" y="148" text-anchor="middle">4</text>
  <rect class="vz-warn vz-dash" x="310" y="122" width="60" height="38" rx="6"/>
  <text class="vz-title" x="340" y="148" text-anchor="middle">?</text>
  <rect class="vz-ml" x="390" y="122" width="60" height="38" rx="6"/>
  <text class="vz-title" x="420" y="148" text-anchor="middle">1</text>
  <text class="vz-s" x="20" y="196" text-anchor="start">User 3</text>
  <rect class="vz-ml" x="150" y="168" width="60" height="38" rx="6"/>
  <text class="vz-title" x="180" y="194" text-anchor="middle">4</text>
  <rect class="vz-warn vz-dash" x="230" y="168" width="60" height="38" rx="6"/>
  <text class="vz-title" x="260" y="194" text-anchor="middle">?</text>
  <rect class="vz-warn vz-dash" x="310" y="168" width="60" height="38" rx="6"/>
  <text class="vz-title" x="340" y="194" text-anchor="middle">?</text>
  <rect class="vz-ml" x="390" y="168" width="60" height="38" rx="6"/>
  <text class="vz-title" x="420" y="194" text-anchor="middle">2</text>
  <text class="vz-s" x="20" y="242" text-anchor="start">User 4</text>
  <rect class="vz-warn vz-dash" x="150" y="214" width="60" height="38" rx="6"/>
  <text class="vz-title" x="180" y="240" text-anchor="middle">?</text>
  <rect class="vz-ml" x="230" y="214" width="60" height="38" rx="6"/>
  <text class="vz-title" x="260" y="240" text-anchor="middle">5</text>
  <rect class="vz-ml" x="310" y="214" width="60" height="38" rx="6"/>
  <text class="vz-title" x="340" y="240" text-anchor="middle">4</text>
  <rect class="vz-warn vz-dash" x="390" y="214" width="60" height="38" rx="6"/>
  <text class="vz-title" x="420" y="240" text-anchor="middle">?</text>
  <text class="vz-s" x="500" y="96" text-anchor="start">Known rating</text>
  <rect class="vz-ml" x="470" y="80" width="20" height="20" rx="4"/>
  <text class="vz-s" x="500" y="130" text-anchor="start">Empty cell to predict</text>
  <rect class="vz-warn" x="470" y="114" width="20" height="20" rx="4"/>
  <text class="vz-s" x="470" y="176" text-anchor="start">The model learns a few hidden</text>
  <text class="vz-s" x="470" y="194" text-anchor="start">"taste numbers" per user and</text>
  <text class="vz-s" x="470" y="212" text-anchor="start">per item, and multiplies them</text>
  <text class="vz-s" x="470" y="230" text-anchor="start">to fill each ? with a guess.</text>
  <text class="vz-n vz-note" x="12" y="290" text-anchor="start">Made-up ratings from 1 to 5.</text>
</svg>
