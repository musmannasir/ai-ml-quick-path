<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- A 3 by 3 filter sliding over a 5 by 5 image gives a 3 by 3 map. -->
  <text class="vz-title" x="30" y="36" text-anchor="start">Image: 5 × 5 pixels</text>
  <rect class="vz-cell" x="30" y="50" width="36" height="36"/>
  <rect class="vz-cell" x="66" y="50" width="36" height="36"/>
  <rect class="vz-cell" x="102" y="50" width="36" height="36"/>
  <rect class="vz-cell" x="138" y="50" width="36" height="36"/>
  <rect class="vz-cell" x="174" y="50" width="36" height="36"/>
  <rect class="vz-cell" x="30" y="86" width="36" height="36"/>
  <rect class="vz-cell" x="66" y="86" width="36" height="36"/>
  <rect class="vz-cell" x="102" y="86" width="36" height="36"/>
  <rect class="vz-cell" x="138" y="86" width="36" height="36"/>
  <rect class="vz-cell" x="174" y="86" width="36" height="36"/>
  <rect class="vz-cell" x="30" y="122" width="36" height="36"/>
  <rect class="vz-cell" x="66" y="122" width="36" height="36"/>
  <rect class="vz-cell" x="102" y="122" width="36" height="36"/>
  <rect class="vz-cell" x="138" y="122" width="36" height="36"/>
  <rect class="vz-cell" x="174" y="122" width="36" height="36"/>
  <rect class="vz-cell" x="30" y="158" width="36" height="36"/>
  <rect class="vz-cell" x="66" y="158" width="36" height="36"/>
  <rect class="vz-cell" x="102" y="158" width="36" height="36"/>
  <rect class="vz-cell" x="138" y="158" width="36" height="36"/>
  <rect class="vz-cell" x="174" y="158" width="36" height="36"/>
  <rect class="vz-cell" x="30" y="194" width="36" height="36"/>
  <rect class="vz-cell" x="66" y="194" width="36" height="36"/>
  <rect class="vz-cell" x="102" y="194" width="36" height="36"/>
  <rect class="vz-cell" x="138" y="194" width="36" height="36"/>
  <rect class="vz-cell" x="174" y="194" width="36" height="36"/>
  <rect class="vz-win" x="30" y="50" width="108" height="108"/>
  <rect class="vz-win2" x="66" y="50" width="108" height="108"/>
  <text class="vz-s" x="30" y="252" text-anchor="start">Solid: first position. Dashed: one pixel to the right.</text>
  <text class="vz-title" x="268" y="86" text-anchor="start">Filter: 3 × 3</text>
  <rect class="vz-cell vz-filt" x="268" y="100" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="298" y="100" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="328" y="100" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="268" y="130" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="298" y="130" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="328" y="130" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="268" y="160" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="298" y="160" width="30" height="30"/>
  <rect class="vz-cell vz-filt" x="328" y="160" width="30" height="30"/>
  <text class="vz-s" x="268" y="212" text-anchor="start">slides across, one</text>
  <text class="vz-s" x="268" y="228" text-anchor="start">pixel at a time</text>
  <line class="vz-arrow" x1="372.0" y1="150.0" x2="429.0" y2="150.0"/>
  <polygon class="vz-headk" points="440.0,150.0 429.0,144.0 429.0,156.0"/>
  <text class="vz-title" x="462" y="58" text-anchor="start">Output: 3 × 3</text>
  <rect class="vz-cell vz-first" x="462" y="70" width="44" height="44"/>
  <rect class="vz-cell vz-second" x="506" y="70" width="44" height="44"/>
  <rect class="vz-cell" x="550" y="70" width="44" height="44"/>
  <rect class="vz-cell" x="462" y="114" width="44" height="44"/>
  <rect class="vz-cell" x="506" y="114" width="44" height="44"/>
  <rect class="vz-cell" x="550" y="114" width="44" height="44"/>
  <rect class="vz-cell" x="462" y="158" width="44" height="44"/>
  <rect class="vz-cell" x="506" y="158" width="44" height="44"/>
  <rect class="vz-cell" x="550" y="158" width="44" height="44"/>
  <text class="vz-s" x="462" y="226" text-anchor="start">5 − 3 + 1 = 3 positions across</text>
  <text class="vz-s" x="462" y="244" text-anchor="start">and 3 down: 3 × 3 = 9 numbers</text>
  <text class="vz-n vz-note" x="12" y="322" text-anchor="start">Each output number says how strongly its patch of the image matches the filter. Early filters find edges.</text>
</svg>
