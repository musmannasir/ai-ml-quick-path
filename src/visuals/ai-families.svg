<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Nested circles: each family is a smaller part of the one around it. -->
  <circle class="vz-ring vz-r0" cx="230" cy="170" r="150"/>
  <circle class="vz-ring vz-r1" cx="230" cy="208" r="112"/>
  <circle class="vz-ring vz-r2" cx="230" cy="246" r="76"/>
  <circle class="vz-ring vz-r3" cx="230" cy="282" r="40"/>
  <text class="vz-ringt" x="230" y="44" text-anchor="middle">Artificial intelligence</text>
  <text class="vz-ringt" x="230" y="120" text-anchor="middle">Machine learning</text>
  <text class="vz-ringt" x="230" y="194" text-anchor="middle">Deep learning</text>
  <text class="vz-ringt" x="230" y="266" text-anchor="middle">Generative AI</text>
  <rect class="vz-ring vz-r0" x="420" y="36" width="18" height="18" rx="4"/>
  <text class="vz-title" x="448" y="50" text-anchor="start">Artificial intelligence</text>
  <text class="vz-s" x="448" y="70" text-anchor="start">Any computer system doing a task</text>
  <text class="vz-s" x="448" y="86" text-anchor="start">that needs human judgement.</text>
  <rect class="vz-ring vz-r1" x="420" y="104" width="18" height="18" rx="4"/>
  <text class="vz-title" x="448" y="118" text-anchor="start">Machine learning</text>
  <text class="vz-s" x="448" y="138" text-anchor="start">Learns its rules from examples</text>
  <text class="vz-s" x="448" y="154" text-anchor="start">instead of being given them.</text>
  <rect class="vz-ring vz-r2" x="420" y="172" width="18" height="18" rx="4"/>
  <text class="vz-title" x="448" y="186" text-anchor="start">Deep learning</text>
  <text class="vz-s" x="448" y="206" text-anchor="start">Machine learning with many-layered</text>
  <text class="vz-s" x="448" y="222" text-anchor="start">neural networks.</text>
  <rect class="vz-ring vz-r3" x="420" y="240" width="18" height="18" rx="4"/>
  <text class="vz-title" x="448" y="254" text-anchor="start">Generative AI</text>
  <text class="vz-s" x="448" y="274" text-anchor="start">Deep learning that creates new text,</text>
  <text class="vz-s" x="448" y="290" text-anchor="start">images, audio or code. An LLM is one kind.</text>
</svg>
