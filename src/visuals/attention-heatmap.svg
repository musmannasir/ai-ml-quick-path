  <text class="vz-n" x="12" y="72" text-anchor="start"></text>
  <text class="vz-s" x="450" y="100" text-anchor="start">Each row is one word working out</text>
  <text class="vz-s" x="450" y="118" text-anchor="start">its new meaning. The numbers in the row</text>
  <text class="vz-s" x="450" y="136" text-anchor="start">are its attention weights and add up to 1.</text>
  <text class="vz-s" x="450" y="172" text-anchor="start">Darker = more attention.</text>
  <rect class="vz-maskcell" x="450" y="196" width="24" height="24"/>
  <text class="vz-s" x="482" y="214" text-anchor="start">Hidden by the causal mask:</text>
  <text class="vz-s" x="482" y="232" text-anchor="start">a word cannot look at later words.</text>
  <text class="vz-s" x="450" y="270" text-anchor="start">Look at the row for "it": most of its</text>
  <text class="vz-s" x="450" y="288" text-anchor="start">attention goes to "cat" (0.75).</text>
  <text class="vz-n vz-note" x="12" y="436" text-anchor="start">Made-up weights (the row for "it" is the one used in the lesson's maths box).</text>
</svg>
