<svg viewBox="0 0 720 284" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- One neuron: weighted inputs, add the bias, ReLU. -->
  <circle class="vz-node" cx="62" cy="86" r="26"/>
  <text class="vz-v" x="62" y="93" text-anchor="middle">2</text>
  <circle class="vz-node" cx="62" cy="196" r="26"/>
  <text class="vz-v" x="62" y="203" text-anchor="middle">3</text>
  <text class="vz-s" x="62" y="40" text-anchor="middle">inputs</text>
  <line class="vz-arrow" x1="90.0" y1="92.0" x2="265.2" y2="124.0"/>
  <polygon class="vz-headk" points="276.0,126.0 266.3,118.1 264.1,129.9"/>
  <line class="vz-arrow" x1="90.0" y1="190.0" x2="265.2" y2="158.0"/>
  <polygon class="vz-headk" points="276.0,156.0 264.1,152.1 266.3,163.9"/>
  <text class="vz-s" x="130" y="90" text-anchor="start">× weight 0.5  =  1</text>
  <text class="vz-s" x="112" y="232" text-anchor="start">× weight −1  =  −3</text>
  <rect class="vz-warn" x="294" y="22" width="86" height="34" rx="8"/>
  <text class="vz-s" x="337" y="45" text-anchor="middle">bias +1</text>
  <line class="vz-arrow" x1="337.0" y1="58.0" x2="337.0" y2="79.0"/>
  <polygon class="vz-headk" points="337.0,90.0 343.0,79.0 331.0,79.0"/>
  <circle class="vz-node vz-big" cx="330" cy="141" r="52"/>
  <text class="vz-s" x="330" y="134" text-anchor="middle">add up</text>
  <text class="vz-v" x="330" y="156" text-anchor="middle">−1</text>
  <text class="vz-s" x="330" y="224" text-anchor="middle">1 + (−3) + 1 = −1</text>
  <line class="vz-arrow" x1="384.0" y1="141.0" x2="443.0" y2="141.0"/>
  <polygon class="vz-headk" points="454.0,141.0 443.0,135.0 443.0,147.0"/>
  <rect class="vz-ml" x="458" y="112" width="112" height="58" rx="10"/>
  <text class="vz-title" x="514" y="137" text-anchor="middle">ReLU</text>
  <text class="vz-s" x="514" y="157" text-anchor="middle">negative → 0</text>
  <line class="vz-arrow" x1="574.0" y1="141.0" x2="617.0" y2="141.0"/>
  <polygon class="vz-headk" points="628.0,141.0 617.0,135.0 617.0,147.0"/>
  <circle class="vz-node" cx="660" cy="141" r="30"/>
  <text class="vz-v" x="660" y="149" text-anchor="middle">0</text>
  <text class="vz-s" x="660" y="196" text-anchor="middle">output:</text>
  <text class="vz-s" x="660" y="214" text-anchor="middle">stays silent</text>
  <text class="vz-n vz-note" x="12" y="270" text-anchor="start">The invented numbers from the lesson. Training is what finds real weights and biases.</text>
</svg>
