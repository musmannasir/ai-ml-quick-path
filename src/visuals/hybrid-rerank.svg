<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Keyword and vector search merged, then re-ranked. -->
  <rect class="vz-ap" x="14" y="20" width="200" height="150" rx="10"/>
  <text class="vz-title" x="114" y="46" text-anchor="middle">Keyword search</text>
  <text class="vz-s" x="114" y="78" text-anchor="middle">1. doc 7</text>
  <text class="vz-s" x="114" y="106" text-anchor="middle">2. doc 2</text>
  <text class="vz-s" x="114" y="134" text-anchor="middle">3. doc 9</text>
  <rect class="vz-lm" x="14" y="190" width="200" height="150" rx="10"/>
  <text class="vz-title" x="114" y="216" text-anchor="middle">Vector search</text>
  <text class="vz-s" x="114" y="248" text-anchor="middle">1. doc 2</text>
  <text class="vz-s" x="114" y="276" text-anchor="middle">2. doc 5</text>
  <text class="vz-s" x="114" y="304" text-anchor="middle">3. doc 7</text>
  <line class="vz-arrow" x1="218.0" y1="96.0" x2="255.8" y2="150.9"/>
  <polygon class="vz-headk" points="262.0,160.0 260.7,147.5 250.8,154.3"/>
  <line class="vz-arrow" x1="218.0" y1="266.0" x2="255.9" y2="209.2"/>
  <polygon class="vz-headk" points="262.0,200.0 250.9,205.8 260.9,212.5"/>
  <rect class="vz-warn" x="266" y="140" width="160" height="80" rx="10"/>
  <text class="vz-title" x="346" y="172" text-anchor="middle">Merge the lists</text>
  <text class="vz-s" x="346" y="194" text-anchor="middle">docs found by both</text>
  <text class="vz-s" x="346" y="210" text-anchor="middle">rise to the top</text>
  <line class="vz-arrow" x1="430.0" y1="180.0" x2="463.0" y2="180.0"/>
  <polygon class="vz-headk" points="474.0,180.0 463.0,174.0 463.0,186.0"/>
  <rect class="vz-ok" x="478" y="140" width="228" height="80" rx="10"/>
  <text class="vz-title" x="592" y="172" text-anchor="middle">Re-ranker</text>
  <text class="vz-s" x="592" y="194" text-anchor="middle">reads question + each</text>
  <text class="vz-s" x="592" y="210" text-anchor="middle">candidate, re-orders</text>
  <text class="vz-title" x="478" y="262" text-anchor="start">Top few go to the model</text>
  <text class="vz-s" x="478" y="284" text-anchor="start">as evidence.</text>
  <text class="vz-n vz-note" x="12" y="364" text-anchor="start">Made-up lists. Keyword search finds exact words; vector search finds similar meaning; together they miss less.</text>
</svg>
