  <text class="vz-title" x="188" y="60" text-anchor="start">Low bias</text>
  <text class="vz-title" x="188" y="82" text-anchor="start">low variance</text>
  <text class="vz-s" x="188" y="112" text-anchor="start">On target</text>
  <text class="vz-s" x="188" y="130" text-anchor="start">and consistent.</text>
  <rect class="vz-card" x="368" y="12" width="340" height="146" rx="10"/>
  <circle class="vz-ring0" cx="452" cy="82" r="58.0"/>
