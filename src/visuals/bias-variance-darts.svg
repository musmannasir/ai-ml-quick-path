  <circle class="vz-ring0" cx="96" cy="238" r="58.0"/>
  <circle class="vz-ring1" cx="96" cy="238" r="38.3"/>
  <circle class="vz-ring2" cx="96" cy="238" r="19.1"/>
  <circle class="vz-dart" cx="124.4" cy="256.6" r="4"/>
  <circle class="vz-dart" cx="119.2" cy="257.1" r="4"/>
  <circle class="vz-dart" cx="123.3" cy="252.5" r="4"/>
  <circle class="vz-dart" cx="120.4" cy="253.7" r="4"/>
  <circle class="vz-dart" cx="125.0" cy="254.2" r="4"/>
