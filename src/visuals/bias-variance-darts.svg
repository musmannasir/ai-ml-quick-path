  <circle class="vz-ring2" cx="452" cy="82" r="19.1"/>
  <circle class="vz-dart" cx="476.4" cy="87.8" r="4"/>
  <circle class="vz-dart" cx="430.0" cy="99.4" r="4"/>
  <circle class="vz-dart" cx="459.0" cy="55.9" r="4"/>
  <circle class="vz-dart" cx="437.5" cy="62.9" r="4"/>
  <circle class="vz-dart" cx="472.3" cy="70.4" r="4"/>
  <circle class="vz-dart" cx="446.2" cy="108.7" r="4"/>
