<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Bias and variance as darts on a board. -->
  <rect class="vz-card" x="12" y="12" width="340" height="146" rx="10"/>
  <circle class="vz-ring0" cx="96" cy="82" r="58.0"/>
  <circle class="vz-ring1" cx="96" cy="82" r="38.3"/>
  <circle class="vz-ring2" cx="96" cy="82" r="19.1"/>
  <circle class="vz-dart" cx="98.3" cy="83.2" r="4"/>
