  <rect class="vz-card" x="368" y="168" width="340" height="146" rx="10"/>
  <circle class="vz-ring0" cx="452" cy="238" r="58.0"/>
  <circle class="vz-ring1" cx="452" cy="238" r="38.3"/>
  <circle class="vz-ring2" cx="452" cy="238" r="19.1"/>
  <circle class="vz-dart" cx="502.5" cy="261.2" r="4"/>
  <circle class="vz-dart" cx="456.1" cy="272.8" r="4"/>
  <circle class="vz-dart" cx="485.1" cy="229.3" r="4"/>
  <circle class="vz-dart" cx="463.6" cy="236.3" r="4"/>
