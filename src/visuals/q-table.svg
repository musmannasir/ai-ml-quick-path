<svg viewBox="0 0 720 284" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- A Q-table and one learning step. -->
  <text class="vz-s" x="180" y="56" text-anchor="middle">left</text>
  <text class="vz-s" x="262" y="56" text-anchor="middle">right</text>
  <text class="vz-s" x="344" y="56" text-anchor="middle">up</text>
  <text class="vz-s" x="426" y="56" text-anchor="middle">down</text>
  <text class="vz-s" x="20" y="94" text-anchor="start">State 1</text>
  <rect class="vz-card" x="150" y="68" width="66" height="38" rx="6"/>
  <text class="vz-title" x="183" y="94" text-anchor="middle">0.10</text>
  <rect class="vz-warn" x="232" y="68" width="66" height="38" rx="6"/>
  <text class="vz-title" x="265" y="94" text-anchor="middle">0.40</text>
  <rect class="vz-card" x="314" y="68" width="66" height="38" rx="6"/>
  <text class="vz-title" x="347" y="94" text-anchor="middle">0.00</text>
  <rect class="vz-card" x="396" y="68" width="66" height="38" rx="6"/>
  <text class="vz-title" x="429" y="94" text-anchor="middle">0.05</text>
  <text class="vz-s" x="20" y="140" text-anchor="start">State 2</text>
  <rect class="vz-card" x="150" y="114" width="66" height="38" rx="6"/>
  <text class="vz-title" x="183" y="140" text-anchor="middle">0.20</text>
  <rect class="vz-card" x="232" y="114" width="66" height="38" rx="6"/>
  <text class="vz-title" x="265" y="140" text-anchor="middle">0.10</text>
  <rect class="vz-card" x="314" y="114" width="66" height="38" rx="6"/>
  <text class="vz-title" x="347" y="140" text-anchor="middle">0.60</text>
  <rect class="vz-card" x="396" y="114" width="66" height="38" rx="6"/>
  <text class="vz-title" x="429" y="140" text-anchor="middle">0.00</text>
  <text class="vz-s" x="20" y="186" text-anchor="start">State 3</text>
  <rect class="vz-card" x="150" y="160" width="66" height="38" rx="6"/>
  <text class="vz-title" x="183" y="186" text-anchor="middle">0.00</text>
  <rect class="vz-card" x="232" y="160" width="66" height="38" rx="6"/>
  <text class="vz-title" x="265" y="186" text-anchor="middle">0.30</text>
  <rect class="vz-card" x="314" y="160" width="66" height="38" rx="6"/>
  <text class="vz-title" x="347" y="186" text-anchor="middle">0.10</text>
  <rect class="vz-card" x="396" y="160" width="66" height="38" rx="6"/>
  <text class="vz-title" x="429" y="186" text-anchor="middle">0.50</text>
  <text class="vz-title" x="14" y="28" text-anchor="start">A Q-table: how good each action looks in each state</text>
  <rect class="vz-card" x="490" y="68" width="216" height="122" rx="10"/>
  <text class="vz-title" x="504" y="92" text-anchor="start">One step of learning</text>
  <text class="vz-s" x="504" y="114" text-anchor="start">old value 0.40, estimate 0.80</text>
  <text class="vz-s" x="504" y="134" text-anchor="start">step size (learning rate) 0.1</text>
  <text class="vz-s" x="504" y="160" text-anchor="start">new = 0.40 + 0.1 × (0.80 − 0.40)</text>
  <text class="vz-title" x="504" y="180" text-anchor="start">     = 0.44</text>
  <text class="vz-s" x="14" y="236" text-anchor="start">The highlighted cell moves a small step towards what the agent just saw, so the table slowly fills in with what it learned.</text>
  <text class="vz-n vz-note" x="12" y="268" text-anchor="start">Made-up values for a tiny grid world.</text>
</svg>
