<svg viewBox="0 0 720 374" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Three attention heads each look at a different word from it. -->
  <rect class="vz-card" x="14" y="42" width="692" height="80" rx="8"/>
  <text class="vz-s" x="24" y="64" text-anchor="start">Head 1: who is "it"?</text>
  <rect class="vz-box" x="250" y="72" width="78" height="34" rx="6"/>
  <text class="vz-s" x="289" y="94" text-anchor="middle">The</text>
  <rect class="vz-box vz-b0" x="340" y="72" width="78" height="34" rx="6"/>
  <text class="vz-s" x="379" y="94" text-anchor="middle">cat</text>
  <rect class="vz-box" x="430" y="72" width="78" height="34" rx="6"/>
  <text class="vz-s" x="469" y="94" text-anchor="middle">sat</text>
  <rect class="vz-box" x="520" y="72" width="78" height="34" rx="6"/>
  <text class="vz-s" x="559" y="94" text-anchor="middle">because</text>
  <rect class="vz-box vz-b1" x="610" y="72" width="78" height="34" rx="6"/>
  <text class="vz-s" x="649" y="94" text-anchor="middle">it</text>
  <path class="vz-arc" d="M379 68 Q 514.0 36 649 68" stroke-width="4"/>
  <rect class="vz-card" x="14" y="134" width="692" height="80" rx="8"/>
  <text class="vz-s" x="24" y="156" text-anchor="start">Head 2: what happened?</text>
  <rect class="vz-box" x="250" y="164" width="78" height="34" rx="6"/>
  <text class="vz-s" x="289" y="186" text-anchor="middle">The</text>
  <rect class="vz-box" x="340" y="164" width="78" height="34" rx="6"/>
  <text class="vz-s" x="379" y="186" text-anchor="middle">cat</text>
  <rect class="vz-box vz-b0" x="430" y="164" width="78" height="34" rx="6"/>
  <text class="vz-s" x="469" y="186" text-anchor="middle">sat</text>
  <rect class="vz-box" x="520" y="164" width="78" height="34" rx="6"/>
  <text class="vz-s" x="559" y="186" text-anchor="middle">because</text>
  <rect class="vz-box vz-b1" x="610" y="164" width="78" height="34" rx="6"/>
  <text class="vz-s" x="649" y="186" text-anchor="middle">it</text>
  <path class="vz-arc" d="M469 160 Q 559.0 128 649 160" stroke-width="4"/>
  <rect class="vz-card" x="14" y="226" width="692" height="80" rx="8"/>
  <text class="vz-s" x="24" y="248" text-anchor="start">Head 3: the reason</text>
  <rect class="vz-box" x="250" y="256" width="78" height="34" rx="6"/>
  <text class="vz-s" x="289" y="278" text-anchor="middle">The</text>
  <rect class="vz-box" x="340" y="256" width="78" height="34" rx="6"/>
  <text class="vz-s" x="379" y="278" text-anchor="middle">cat</text>
  <rect class="vz-box" x="430" y="256" width="78" height="34" rx="6"/>
  <text class="vz-s" x="469" y="278" text-anchor="middle">sat</text>
  <rect class="vz-box vz-b0" x="520" y="256" width="78" height="34" rx="6"/>
  <text class="vz-s" x="559" y="278" text-anchor="middle">because</text>
  <rect class="vz-box vz-b1" x="610" y="256" width="78" height="34" rx="6"/>
  <text class="vz-s" x="649" y="278" text-anchor="middle">it</text>
  <path class="vz-arc" d="M559 252 Q 604.0 220 649 252" stroke-width="4"/>
  <text class="vz-title" x="14" y="28" text-anchor="start">Several heads read the same sentence, each with its own question</text>
  <text class="vz-n vz-note" x="14" y="340" text-anchor="start">Illustrative: one arc per head from "it". A real model has many heads per layer.</text>
  <text class="vz-n vz-note" x="14" y="358" text-anchor="start">What each head learns is found by training, not set by hand.</text>
</svg>
