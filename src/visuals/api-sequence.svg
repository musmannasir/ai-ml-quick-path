<svg viewBox="0 0 720 366" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- One request to an LLM API and a streamed reply. -->
  <rect class="vz-ml" x="60" y="20" width="170" height="40" rx="8"/>
  <text class="vz-title" x="145" y="46" text-anchor="middle">Your application</text>
  <rect class="vz-lm" x="490" y="20" width="170" height="40" rx="8"/>
  <text class="vz-title" x="575" y="46" text-anchor="middle">LLM API</text>
  <line class="vz-fb" x1="145" y1="64" x2="145" y2="330"/>
  <line class="vz-fb" x1="575" y1="64" x2="575" y2="330"/>
  <line class="vz-arrow" x1="150.0" y1="100.0" x2="559.0" y2="100.0"/>
  <polygon class="vz-headk" points="570.0,100.0 559.0,94.0 559.0,106.0"/>
  <text class="vz-s" x="360" y="90" text-anchor="middle">request: system message + user messages</text>
  <text class="vz-n" x="360" y="118" text-anchor="middle">(tokens in are counted)</text>
  <line class="vz-arrow" x1="570.0" y1="160.0" x2="161.0" y2="163.9"/>
  <polygon class="vz-headk" points="150.0,164.0 161.1,169.9 160.9,157.9"/>
  <line class="vz-arrow" x1="570.0" y1="192.0" x2="161.0" y2="195.9"/>
  <polygon class="vz-headk" points="150.0,196.0 161.1,201.9 160.9,189.9"/>
  <line class="vz-arrow" x1="570.0" y1="224.0" x2="161.0" y2="227.9"/>
  <polygon class="vz-headk" points="150.0,228.0 161.1,233.9 160.9,221.9"/>
  <line class="vz-arrow" x1="570.0" y1="256.0" x2="161.0" y2="259.9"/>
  <polygon class="vz-headk" points="150.0,260.0 161.1,265.9 160.9,253.9"/>
  <text class="vz-s" x="360" y="150" text-anchor="middle">reply arrives in small pieces (streaming)</text>
  <text class="vz-n" x="360" y="282" text-anchor="middle">first piece = time to first token</text>
  <text class="vz-n" x="360" y="304" text-anchor="middle">(tokens out are counted)</text>
  <text class="vz-n vz-note" x="12" y="350" text-anchor="start">The API key stays in your configuration, never in the page or the prompt.</text>
</svg>
