  <text class="vz-title" x="14" y="28" text-anchor="start">An activation function bends the sum, so layers can learn curves</text>
  <text class="vz-s" x="14" y="262" text-anchor="start">Without any bend, a stack of layers collapses into one straight-line model.</text>
  <text class="vz-s" x="14" y="282" text-anchor="start">With it, a network can learn XOR and much more.</text>
  <text class="vz-n vz-note" x="12" y="306" text-anchor="start">Hand-drawn shapes of the common functions (tanh looks like a sigmoid that runs from -1 to 1).</text>
