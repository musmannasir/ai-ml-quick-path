  <text class="vz-title" x="500" y="50" text-anchor="start">PCA</text>
  <text class="vz-s" x="500" y="80" text-anchor="start">Many columns in, a few out.</text>
  <text class="vz-s" x="500" y="112" text-anchor="start">Find the direction in which</text>
  <text class="vz-s" x="500" y="130" text-anchor="start">the data varies most (the</text>
  <text class="vz-s" x="500" y="148" text-anchor="start">green line), then describe</text>
  <text class="vz-s" x="500" y="166" text-anchor="start">each point by where its</text>
  <text class="vz-s" x="500" y="184" text-anchor="start">"shadow" falls on it.</text>
  <text class="vz-s" x="500" y="216" text-anchor="start">Two columns become one,</text>
  <text class="vz-s" x="500" y="234" text-anchor="start">and most of the pattern</text>
  <text class="vz-s" x="500" y="252" text-anchor="start">is kept.</text>
  <text class="vz-n vz-note" x="12" y="306" text-anchor="start">Made-up points in two dimensions. Real data has many columns and often needs several components.</text>
