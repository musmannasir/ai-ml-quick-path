  <rect class="vz-chunk2" x="136" y="244" width="220" height="12" rx="3"/>
  <rect class="vz-chunk" x="248" y="228" width="220" height="12" rx="3"/>
  <rect class="vz-chunk" x="360" y="244" width="220" height="12" rx="3"/>
  <rect class="vz-chunk" x="472" y="228" width="220" height="12" rx="3"/>
  <text class="vz-s" x="24" y="282" text-anchor="start">The second chunk (the highlighted bar) holds the whole answer. The price: more chunks to store and search.</text>
  <text class="vz-n vz-note" x="24" y="312" text-anchor="start">Illustrative. The right size and overlap depend on your documents; test them with real questions.</text>
</svg>
