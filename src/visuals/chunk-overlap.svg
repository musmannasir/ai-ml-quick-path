  <rect class="vz-ans" x="276" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-ans" x="304" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="332" y="194" width="26" height="26" rx="4"/>
