<svg viewBox="0 0 720 328" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Chunk size and overlap decide whether an answer stays whole. -->
  <text class="vz-s" x="24" y="28" text-anchor="start">A page of text as 24 word blocks. The answer to a question sits in the highlighted words.</text>
  <text class="vz-title" x="24" y="62" text-anchor="start">Chunks of 8 words, no overlap</text>
  <rect class="vz-wd" x="24" y="72" width="26" height="26" rx="4"/>
