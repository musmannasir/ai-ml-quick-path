  <rect class="vz-wd" x="416" y="72" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="444" y="72" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="472" y="72" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="500" y="72" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="528" y="72" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="556" y="72" width="26" height="26" rx="4"/>
