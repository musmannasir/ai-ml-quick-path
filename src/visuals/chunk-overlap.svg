  <rect class="vz-chunk" x="248" y="106" width="220" height="12" rx="3"/>
  <rect class="vz-chunk" x="472" y="106" width="220" height="12" rx="3"/>
  <text class="vz-s" x="24" y="142" text-anchor="start">The answer is cut across two chunks. Neither chunk holds all of it, so a search may miss it.</text>
  <text class="vz-title" x="24" y="184" text-anchor="start">Chunks of 8 words, overlapping by 4</text>
  <rect class="vz-wd" x="24" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="52" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="80" y="194" width="26" height="26" rx="4"/>
