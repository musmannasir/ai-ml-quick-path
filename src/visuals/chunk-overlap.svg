  <rect class="vz-wd" x="612" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="640" y="194" width="26" height="26" rx="4"/>
  <rect class="vz-wd" x="668" y="194" width="26" height="26" rx="4"/>
