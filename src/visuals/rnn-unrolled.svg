<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- An RNN unrolled over three words. -->
  <rect class="vz-lm" x="60" y="120" width="130" height="70" rx="12"/>
  <text class="vz-title" x="125" y="150" text-anchor="middle">RNN cell</text>
  <text class="vz-s" x="125" y="172" text-anchor="middle">updates memory</text>
  <rect class="vz-ap" x="85" y="232" width="80" height="34" rx="8"/>
  <text class="vz-title" x="125" y="255" text-anchor="middle">"the"</text>
  <line class="vz-arrow" x1="125.0" y1="230.0" x2="125.0" y2="205.0"/>
  <polygon class="vz-headk" points="125.0,194.0 119.0,205.0 131.0,205.0"/>
  <line class="vz-arrow" x1="194.0" y1="155.0" x2="255.0" y2="155.0"/>
  <polygon class="vz-headk" points="266.0,155.0 255.0,149.0 255.0,161.0"/>
  <text class="vz-s" x="230" y="142" text-anchor="middle">memory</text>
  <rect class="vz-lm" x="270" y="120" width="130" height="70" rx="12"/>
  <text class="vz-title" x="335" y="150" text-anchor="middle">RNN cell</text>
  <text class="vz-s" x="335" y="172" text-anchor="middle">updates memory</text>
  <rect class="vz-ap" x="295" y="232" width="80" height="34" rx="8"/>
  <text class="vz-title" x="335" y="255" text-anchor="middle">"cat"</text>
  <line class="vz-arrow" x1="335.0" y1="230.0" x2="335.0" y2="205.0"/>
  <polygon class="vz-headk" points="335.0,194.0 329.0,205.0 341.0,205.0"/>
  <line class="vz-arrow" x1="404.0" y1="155.0" x2="465.0" y2="155.0"/>
  <polygon class="vz-headk" points="476.0,155.0 465.0,149.0 465.0,161.0"/>
  <text class="vz-s" x="440" y="142" text-anchor="middle">memory</text>
  <rect class="vz-lm" x="480" y="120" width="130" height="70" rx="12"/>
  <text class="vz-title" x="545" y="150" text-anchor="middle">RNN cell</text>
  <text class="vz-s" x="545" y="172" text-anchor="middle">updates memory</text>
  <rect class="vz-ap" x="505" y="232" width="80" height="34" rx="8"/>
  <text class="vz-title" x="545" y="255" text-anchor="middle">"sat"</text>
  <line class="vz-arrow" x1="545.0" y1="230.0" x2="545.0" y2="205.0"/>
  <polygon class="vz-headk" points="545.0,194.0 539.0,205.0 551.0,205.0"/>
  <line class="vz-arrow" x1="545.0" y1="116.0" x2="545.0" y2="81.0"/>
  <polygon class="vz-headk" points="545.0,70.0 539.0,81.0 551.0,81.0"/>
  <rect class="vz-ok" x="470" y="36" width="190" height="32" rx="8"/>
  <text class="vz-s" x="565" y="58" text-anchor="middle">prediction from the final memory</text>
  <text class="vz-title" x="14" y="28" text-anchor="start">A recurrent network reads one word at a time</text>
  <text class="vz-s" x="14" y="296" text-anchor="start">It is one cell used again and again, passing its memory (the hidden state) forward. Early words fade, which is why</text>
  <text class="vz-s" x="14" y="316" text-anchor="start">transformers, which look at all positions at once, replaced it for most language tasks.</text>
</svg>
