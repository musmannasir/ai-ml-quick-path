<svg viewBox="0 0 720 306" xmlns="http://www.w3.org/2000/svg" class="vz-svg" focusable="false">
  <!-- Bayes' rule as counts of people. -->
  <text class="vz-title" x="20" y="32" text-anchor="start">10,000 people</text>
  <rect class="vz-ok" x="40" y="44" width="640" height="34" rx="4"/>
  <rect class="vz-bad" x="40" y="44" width="6" height="34" rx="4"/>
  <text class="vz-s" x="54.4" y="66" text-anchor="start">100 ill (1 in 100)</text>
  <text class="vz-s" x="680" y="66" text-anchor="end">9,900 healthy</text>
  <text class="vz-title" x="20" y="112" text-anchor="start">Only those with a positive test: 585 people (zoomed in)</text>
  <rect class="vz-bad" x="40" y="124" width="98" height="46" rx="4"/>
  <rect class="vz-ok" x="138" y="124" width="542" height="46" rx="4"/>
  <text class="vz-s" x="48" y="152" text-anchor="start">90 really ill</text>
  <text class="vz-s" x="680" y="152" text-anchor="end">495 healthy people with a false alarm</text>
  <text class="vz-s" x="20" y="214" text-anchor="start">90 of 100 ill people test positive.  5% of the 9,900 healthy people also do: 495.</text>
  <text class="vz-title" x="20" y="240" text-anchor="start">A positive test means: 90 ÷ (90 + 495) = 90 ÷ 585</text>
  <text class="vz-title" x="20" y="264" text-anchor="start">which is about 15% chance of being ill, not 90%.</text>
  <text class="vz-n vz-note" x="20" y="292" text-anchor="start">Made-up numbers, as in the lesson's maths box. The bars are drawn to scale in each row.</text>
</svg>
